[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "drf"
version = "1.0.0"
description = "Inference-Time Quality Optimization in Instance Segmentation"
authors = [{ name = "Botond Benkő", email = "benkobotika@yahoo.com" }]
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
  "Pillow>=12.1,<13",
  "opencv-python>=4.13,<5",
  "tqdm>=4.67,<5",
  "pycocotools>=2.0,<3",
  "pyyaml>=6.0.3,<7",
  "addict>=2.4.0,<3",
  "httpx~=0.28.1",
  "pandas>=3.0.2,<4",
  "pylint>=4.0.5,<5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["drf", "drf.*"]
